name: APRJ Python Syntax and Tests

on:
  push:
    branches:
      - crg_aprj
    paths:
      - "enterprise/**/*.py"
      - "enterprise/**/*.txt"
      - "enterprise/**/*.md"
      - "enterprise/**/*.bat"
      - "enterprise/.gitignore"
      - "APRJ_PORTABLE_GUIDE.txt"
      - "APRJ_NEXT_DEVELOPMENT_MAP.txt"
      - ".github/workflows/aprj-syntax.yml"
  workflow_dispatch:

jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal test dependency
        run: python -m pip install "openpyxl>=3.1,<4" "Pillow>=10,<13" "piexif>=1.1.3,<2"
      - name: Compile Python source files
        run: python -m compileall -q enterprise
      - name: Run regression tests
        working-directory: enterprise
        run: python -m unittest discover -s tests -v
